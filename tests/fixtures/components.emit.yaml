# Exercises filter and each emit feature.
filter:
  # Drops deprecated operations without a body, so keeps the deprecated POST.
  not: { deprecated: true, not: { request: { content_type: '*' } } }

emit:
  - name: GetRequests
    description: Every GET operation.
    where: { method: GET }
    shape: '{type_name}'

  - name: '{Tags}Routes'
    group_by: tags
    shape: { '{METHOD} {path}': '{type_name}' }

  - name: ShopPaths
    where: { path: '/shop/**' }
    shape: { '{path}': { '{method}': '{type_name}' } }

  # PUT has no operationId, so it's skipped.
  - name: RequestBodies
    where: { request: { content_type: '*' } }
    shape: { '{id}': { ref: '{request}', pick: [body] } }

  # An operation is under each of its tags; colliding keys are unioned.
  - name: ByTag
    shape: { '{tags}': '{type_name}' }

  - name: '{METHOD}Ops'
    group_by: method
    shape:
      '{path}':
        request: '{request}'
        response: '{response}'

  # The emit-level `where` drops operations; the value-level one narrows a
  # response union.
  - name: JsonOps
    where: { request: { content_type: application/json } }
    shape:
      '{METHOD} {path}':
        request: '{request}'
        response:
          ref: '{response}'
          where: { content_type: application/json }

  # Grouping by the request content type narrows `{request}` to it.
  - name: '{request.content_type|pascal}Ops'
    group_by: request.content_type
    shape:
      '{path}':
        method: '{method}'
        request: { ref: '{request}', pick: [body, query, params] }
        response: { ref: '{response}', where: { content_type: application/json } }

  - name: '{tags|pascal}Union'
    group_by: tags
    where: { deprecated: false }
    shape: '{type_name}'

  - name: Errors
    where: { response: { status: [4xx, default] } }
    shape:
      '{METHOD} {path}': { ref: '{response}', where: { not: { status: 2xx } }, pick: [status, body] }

  # One key per status, with `{response.body}` narrowed to it.
  - name: Bodies
    shape:
      '{METHOD} {path}':
        '{response.status}': '{response.body}'

  - name: Summaries
    shape: { '{type_name}': '{summary}' }
