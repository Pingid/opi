# yaml-language-server: $schema=https://raw.githubusercontent.com/Pingid/opi/refs/heads/main/schema.json

# Schema `format` -> the TS type used instead of string / number.
formats: { binary: Blob }

# openapi ref types that appear inside types are resolved to 
# top level declarations if it exists, otherwise they are emitted inline.
./my.openapi.ts:
  # Emit each schema as standalone type literal declaration
  - each: "schema"
    emit: { type: "{name}" }

  # Emit each route as standalone type literal declaration. `request` is a
  # union with a variant per body content type, each with its params; 
  # `response` a union of { status, contentType, body }.
  - each: "route"
    emit: {
      type: "{method}{path}",
      fields: { method: "{method}", request: "{request}", response: "{response}" }
    }

  # "METHOD /path" -> request / response: the map the ts fetch / xhr
  # clients take. `{METHOD}` is upper case, `{Method}` Pascal case.
  - each: "route"
    where: { deprecated: false }
    emit: {
      type: "Routes",
      fields: {
        "{METHOD} {path}": {
            # Reference the already emitted type
            request: "{method}{path}['request']", 
            response: "{method}{path}['response']" 
        }
      }
    }
